name: Build Fabric mod

on:
  push:
    branches: [26.3-fabric]
  pull_request:
    branches: [26.3-fabric]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {minecraft: '26.3', java: '25'}
          - {minecraft: '26.2', java: '25'}
          - {minecraft: '26.1.2', java: '25'}
          - {minecraft: '26.1', java: '25'}
          - {minecraft: '1.21.11', java: '21'}
          - {minecraft: '1.21.10', java: '21'}
          - {minecraft: '1.21.8', java: '21'}
          - {minecraft: '1.21.5', java: '21'}
    env:
      MC_VERSION: ${{ matrix.minecraft }}
      MC_JAVA: ${{ matrix.java }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out player mod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Java 21 for game tests
        if: matrix.java == '21'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Check out the Kaleidoscope Doll dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WM-wuming/KaleidoscopeDoll-Refabricated-Fabric
          ref: 443786642df21bcefad370d9e1f67511545fcc7f
          path: kaleidoscope-doll-dependency
          persist-credentials: false

      - name: Build Kaleidoscope Doll dependency
        run: |
          task=jar
          if [[ "$MC_JAVA" == '21' ]]; then
            task=remapJar
          fi
          bash ./gradlew --no-daemon --console=plain --project-dir kaleidoscope-doll-dependency \
            "-PminecraftTarget=$MC_VERSION" "-Porg.gradle.java.installations.fromEnv=JAVA_HOME_${MC_JAVA}_X64" \
            -Ploom_version=1.19.6 "$task"

      - name: Build and test player mod
        id: player
        run: |
          output="build/minecraft-$MC_VERSION/libs"
          if [[ "$MC_VERSION" == '26.3' ]]; then
            output='build/libs'
          fi
          dependency="$GITHUB_WORKSPACE/kaleidoscope-doll-dependency/$output/kaleidoscopedoll-$MC_VERSION-fabric-1.4.2-fabric+mc$MC_VERSION.jar"
          if [[ ! -f "$dependency" ]]; then
            echo "::error::Expected Kaleidoscope Doll dependency JAR was not built."
            exit 1
          fi
          bash ./gradlew --no-daemon --console=plain "-PminecraftTarget=$MC_VERSION" \
            "-Porg.gradle.java.installations.fromEnv=JAVA_HOME_${MC_JAVA}_X64" \
            "-PlocalDollDependency=$dependency" build runGameTest

          shopt -s nullglob
          jars=("$output"/kaleidoscope_doll_player-*"+mc$MC_VERSION".jar)
          sources=("$output"/kaleidoscope_doll_player-*"+mc$MC_VERSION"-sources.jar)
          if (( ${#jars[@]} != 1 || ${#sources[@]} != 1 )); then
            echo "::error::Expected one mod JAR and one sources JAR for Minecraft $MC_VERSION."
            exit 1
          fi
          {
            echo 'artifacts<<EOF'
            printf '%s\n' "${jars[0]}" "${sources[0]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload player mod artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaleidoscope-doll-player-${{ matrix.minecraft }}-fabric
          path: ${{ steps.player.outputs.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: >-
      github.repository == 'WM-wuming/Kaleidoscope-Doll-Player' &&
      github.ref == 'refs/heads/26.3-fabric' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download player mod artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kaleidoscope-doll-player-*-fabric
          path: release-artifacts

      - name: Publish build prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          artifact_dirs=(release-artifacts/kaleidoscope-doll-player-*-fabric)
          if (( ${#artifact_dirs[@]} == 0 )); then
            echo "::error::No player mod artifacts were downloaded."
            exit 1
          fi
          jars=()
          versions=()
          for directory in "${artifact_dirs[@]}"; do
            target="${directory##*/kaleidoscope-doll-player-}"
            target="${target%-fabric}"
            mod_jars=("$directory"/kaleidoscope_doll_player-*"+mc$target".jar)
            sources=("$directory"/kaleidoscope_doll_player-*"+mc$target"-sources.jar)
            if (( ${#mod_jars[@]} != 1 || ${#sources[@]} != 1 )); then
              echo "::error::Incomplete artifacts for Minecraft $target."
              exit 1
            fi
            jars+=("${mod_jars[0]}" "${sources[0]}")
            versions+=("$target")
          done

          short_sha="${GITHUB_SHA::12}"
          tag="build-$short_sha"
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" "${jars[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --draft=false
            else
              echo "Release $tag is already published."
            fi
            exit 0
          fi

          gh release create "$tag" "${jars[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Kaleidoscope Doll Player | Fabric ($short_sha)" \
            --notes "Automated build of commit $GITHUB_SHA. Minecraft versions: ${versions[*]}. Install the matching Kaleidoscope Doll dependency separately."
