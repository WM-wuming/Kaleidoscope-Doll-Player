name: Build Fabric mod

on:
  push:
    branches: [26.3-fabric]
  pull_request:
    branches: [26.3-fabric]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out player mod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Check out the Kaleidoscope Doll dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WM-wuming/KaleidoscopeDoll-26.3-Fabric
          ref: 28766b1c79ae53cf4c10c23280a75413c2cfa542
          path: kaleidoscope-doll-dependency
          persist-credentials: false

      - name: Build Kaleidoscope Doll dependency
        run: bash ./gradlew --no-daemon --console=plain --project-dir kaleidoscope-doll-dependency -Ploom_version=1.19.4 jar

      - name: Build player mod
        run: |
          dependency="$GITHUB_WORKSPACE/kaleidoscope-doll-dependency/build/libs/kaleidoscopedoll-26.3-fabric-1.4.2-fabric+mc26.3.jar"
          if [[ ! -f "$dependency" ]]; then
            echo "::error::Expected Kaleidoscope Doll dependency JAR was not built."
            exit 1
          fi
          bash ./gradlew --no-daemon --console=plain "-PlocalDollDependency=$dependency" build

      - name: Upload player mod artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaleidoscope-doll-player-26.3-fabric
          path: build/libs/kaleidoscope_doll_player-*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: >-
      github.repository == 'WM-wuming/Kaleidoscope-Doll-Player' &&
      github.ref == 'refs/heads/26.3-fabric' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download player mod artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kaleidoscope-doll-player-26.3-fabric
          path: release-artifacts

      - name: Publish build prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          jars=(release-artifacts/kaleidoscope_doll_player-*.jar)
          if (( ${#jars[@]} != 2 )); then
            echo "::error::Expected the player mod JAR and its sources JAR."
            exit 1
          fi

          short_sha="${GITHUB_SHA::12}"
          tag="build-$short_sha"
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" "${jars[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --draft=false
            else
              echo "Release $tag is already published."
            fi
            exit 0
          fi

          gh release create "$tag" "${jars[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Kaleidoscope Doll Player | 26.3 Fabric ($short_sha)" \
            --notes "Automated build of commit $GITHUB_SHA. Requires Kaleidoscope Doll for Minecraft 26.3 Fabric."
