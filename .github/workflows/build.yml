name: Build Fabric mod

on:
  push:
    branches: [26.3-fabric]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'WM-wuming/Kaleidoscope-Doll-Player' && github.ref == 'refs/heads/26.3-fabric'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out player mod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Check out the private Kaleidoscope Doll dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WM-wuming/KaleidoscopeDoll-26.3-Fabric
          ref: 28766b1c79ae53cf4c10c23280a75413c2cfa542
          path: kaleidoscope-doll-dependency
          ssh-key: ${{ secrets.KALEIDOSCOPE_DOLL_DEPLOY_KEY }}
          persist-credentials: false

      - name: Build Kaleidoscope Doll dependency
        run: bash ./gradlew --no-daemon --console=plain --project-dir kaleidoscope-doll-dependency -Ploom_version=1.19.4 jar

      - name: Build player mod
        run: |
          dependency="$GITHUB_WORKSPACE/kaleidoscope-doll-dependency/build/libs/kaleidoscopedoll-26.3-fabric-1.4.2-fabric+mc26.3.jar"
          if [[ ! -f "$dependency" ]]; then
            echo "::error::Expected Kaleidoscope Doll dependency JAR was not built."
            exit 1
          fi
          bash ./gradlew --no-daemon --console=plain "-PlocalDollDependency=$dependency" build

      - name: Upload player mod artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaleidoscope-doll-player-26.3-fabric
          path: build/libs/kaleidoscope_doll_player-*.jar
          if-no-files-found: error
          retention-days: 14
