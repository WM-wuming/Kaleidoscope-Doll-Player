import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'maven-publish'
}

def target = providers.gradleProperty("minecraftTarget").orElse(project.minecraft_version).get()
def profiles = [
	"1.20.1": [api: "0.92.12+1.20.1", gecko: "4.8.6", geckoFile: "rt5We1KU", config: "HvR3IdRE", java: 17],
	"1.20.2": [api: "0.91.6+1.20.2", gecko: "4.3.1", geckoFile: "496UKM7k", config: "sK1XwxTt", nightConfig: "3.6.6", java: 17],
	"1.20.4": [api: "0.97.3+1.20.4", gecko: "4.4.4", geckoFile: "9xn1SoTo", config: "xbVGsTLe", nightConfig: "3.6.6", java: 17],
	"1.20.6": [api: "0.100.8+1.20.6", gecko: "4.5.4", geckoFile: "9IHFGXrW", config: "LDpciQaD", nightConfig: "3.6.7", java: 21],
	"1.21": [api: "0.102.0+1.21", gecko: "4.5.8", geckoFile: "11VBhLU2", config: "GOreNSW6", java: 21],
	"1.21.1": [api: "0.116.18+1.21.1", gecko: "4.9.5", geckoFile: "ET6x3zyz", config: "N5qzq0XV", java: 21],
	"1.21.4": [api: "0.119.4+1.21.4", gecko: "4.8.5", geckoFile: "HFSs3Co0", config: "SSKF75hc", nightConfig: "3.8.1", java: 21],
	"1.21.5": [api: "0.128.2+1.21.5", gecko: "5.1.0", geckoFile: "AyXpbm2h", config: "fWnEuNPu", nightConfig: "3.8.1", java: 21],
	"1.21.8": [api: "0.136.1+1.21.8", gecko: "5.2.2", geckoFile: "k4Azk0wN", config: "YbUUjWdw", nightConfig: "3.8.3", java: 21],
	"1.21.10": [api: "0.138.4+1.21.10", gecko: "5.3-alpha-3", geckoFile: "7qjQQSWv", config: "IKHTwwTv", java: 21],
	"1.21.11": [api: "0.141.6+1.21.11", gecko: "5.4.6", geckoFile: "OUCukQHN", config: "uXrWPsCu", java: 21],
	"26.1": [api: "0.145.1+26.1", gecko: "5.5", geckoFile: "yUpAp23B", config: "J2q1Fj7S"],
	"26.1.2": [api: "0.155.3+26.1.2", gecko: "5.5.3", geckoFile: "rZnYqWVd", config: "jUe0ucoE"],
	"26.2": [api: "0.161.0+26.2", gecko: "5.5.7", geckoFile: "FJ4Z5QYo", config: "rSd3GiG8"],
	"26.3": [api: project.fabric_api_version, gecko: project.geckolib_version, config: "JpKvrr9J"]
]
def profile = profiles[target]
if (profile == null) {
	throw new GradleException("Unsupported Minecraft target '${target}'. Choose ${profiles.keySet().join(', ')}.")
}
def defaultTarget = target == project.minecraft_version
def javaRelease = profile.java ?: 25
def remapped = javaRelease < 25
def legacyModels = target in ["1.20.1", "1.20.2", "1.20.4", "1.20.6", "1.21", "1.21.1"]
def legacyDataPaths = target.startsWith("1.20.")
apply plugin: (remapped ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom')
def upstreamBuild = defaultTarget ? "build" : "build/minecraft-${target}"
layout.buildDirectory = layout.projectDirectory.dir(upstreamBuild)

version = "${project.mod_version}-fabric+mc${target}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// GeckoLib 依赖库
	maven {
		name = 'GeckoLib'
		url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroup("com.geckolib")
			includeGroup("com.eliotlash.mclib")
		}
	}
	exclusiveContent {
		forRepository {
			maven { url 'https://api.modrinth.com/maven' }
		}
		filter { includeGroup("maven.modrinth") }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"kaleidoscope_doll_player" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	if (!defaultTarget) {
		runs.configureEach { runDir("${upstreamBuild}/run/${name}") }
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "kaleidoscope_doll_player_test"
		enableClientGameTests = !legacyModels
		clearRunDirectory = true
	}
}

if (legacyModels) {
	loom.runs.register("legacyClientSmoke") {
		client()
		source sourceSets.gametest
		vmArg "-Dkaleidoscope.doll.player.legacyClientSmoke=true"
	}
}

// Loom's test defaults share build/run even when the build directory is versioned.
(legacyModels ? ["gameTest"] : ["gameTest", "clientGameTest"]).each { testRun ->
	loom.runs.named(testRun) { runDir("${upstreamBuild}/test-runs/${testRun}") }
}

dependencies {
	minecraft "com.mojang:minecraft:${target}"
	if (remapped) mappings loom.officialMojangMappings()
	def scope = remapped ? "modImplementation" : "implementation"
	add(scope, "net.fabricmc:fabric-loader:${project.loader_version}")
	add(scope, "net.fabricmc.fabric-api:fabric-api:${profile.api}")
	add(scope, profile.geckoFile ? "maven.modrinth:geckolib:${profile.geckoFile}"
			: "com.geckolib:geckolib-fabric-${target}:${profile.gecko}")
	add(scope, files(providers.gradleProperty("localDollDependency").orElse(
			"../KaleidoscopeDoll/${upstreamBuild}/libs/kaleidoscopedoll-${target}-fabric-1.4.2-fabric+mc${target}.jar")))
	add(remapped ? "modLocalRuntime" : "localRuntime", "maven.modrinth:forge-config-api-port:${profile.config}")
	if (javaRelease == 17) localRuntime "com.eliotlash.mclib:mclib:20"
	if (target != "1.20.1") {
		def nightConfig = profile.nightConfig ?: "3.8.0"
		localRuntime "com.electronwill.night-config:core:${nightConfig}"
		localRuntime "com.electronwill.night-config:toml:${nightConfig}"
	}
}

if (remapped) {
	ext.remappedMinecraftTarget = target
	apply from: 'gradle/remapped-sources.gradle'
}

processResources {
	def metadata = [version: project.version, minecraft_version: target,
					loader_version: project.loader_version, geckolib_version: profile.gecko, java_version: javaRelease]
	inputs.properties metadata
	filteringCharset = "UTF-8"

	filesMatching("fabric.mod.json") {
		expand metadata
	}
	if (legacyModels || target == "1.21.4") {
		from("src/main/resources/assets/kaleidoscope_doll_player/geckolib/models") {
			into("assets/kaleidoscope_doll_player/geo")
		}
		from("src/main/resources/assets/kaleidoscope_doll_player/geckolib/animations") {
			into("assets/kaleidoscope_doll_player/animations")
		}
	}
	if (legacyModels) {
		exclude "assets/kaleidoscope_doll_player/items/**", "assets/kaleidoscope_doll_player/geckolib/**"
	}
	if (legacyDataPaths) {
		filesMatching("data/**/*.json") {
			path = path.replace("/loot_table/", "/loot_tables/").replace("/recipe/", "/recipes/")
		}
	}
	if (!defaultTarget) {
		doLast {
			def data = new File(destinationDir, "data/kaleidoscope_doll_player")
			def lootFile = new File(data, "${legacyDataPaths ? 'loot_tables' : 'loot_table'}/blocks/player_doll.json")
			def loot = new JsonSlurper().parse(lootFile)
			def pool = loot.pools[0]
			def entry = pool.entries[0]
			def condition = pool.remove("condition")
			pool.conditions = [[condition: condition.type]]
			if (remapped || target in ["26.1", "26.1.2"]) pool.bonus_rolls = 0
			def modifier = entry.remove("modifier")
			modifier.function = modifier.remove("type")
			entry.functions = javaRelease == 17 ? [[function: "minecraft:copy_nbt", source: "block_entity",
					ops: [[source: "Owner", target: "kaleidoscope_doll_player_profile", op: "replace"]]]] : [modifier]
			if (target == "1.20.1") loot.remove("random_sequence")
			lootFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(loot)) + "\n", "UTF-8")
			if (legacyModels) {
				def assets = new File(destinationDir, "assets/kaleidoscope_doll_player")
				def itemFile = new File(assets, "models/item/player_doll.json")
				def itemModel = new JsonSlurper().parse(itemFile)
				itemModel.parent = "builtin/entity"
				itemFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(itemModel)) + "\n", "UTF-8")
				def recipeFile = new File(data, "${legacyDataPaths ? 'recipes' : 'recipe'}/skin_lock.json")
				def recipe = new JsonSlurper().parse(recipeFile)
				recipe.ingredients = recipe.ingredients.collect { [item: it] }
				if (javaRelease == 17) recipe.result.item = recipe.result.remove("id")
				recipeFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(recipe)) + "\n", "UTF-8")
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
	it.options.encoding = "UTF-8"
}

tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor { languageVersion.set(JavaLanguageVersion.of(javaRelease)) }
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	toolchain.languageVersion = JavaLanguageVersion.of(javaRelease)
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE")
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_gradle_module_metadata.html#sub:disabling-gmm-publication
	// for more information on how to disable Gradle Module Metadata.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
